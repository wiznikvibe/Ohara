services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adv_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:

    image: qdrant/qdrant:v1.17.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  app:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    
    ports:
      - "8000:8000"
    working_dir: /app
    # Host seed (make seed-docs) talks to localhost:6333. On Docker Desktop/WSL
    # that is often NOT the compose `qdrant` service — point the app at the same
    # host-published endpoint so queries see the ingested collection.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Non-secrets only. Secrets come from env_file (.env) — do not re-declare
      # them with ${VAR} here or empty host interpolation will override/blank them.
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/adv_rag
      - QDRANT_URL=http://host.docker.internal:6333
      - LOG_JSON=false
      - LOG_LEVEL=INFO
      # Self-RAG / reflection tuning (overridable via host .env)
      - REFLECTION_MIN_SCORE=${REFLECTION_MIN_SCORE:-0.85}
      - MAX_REFLECTION_RETRIES=${MAX_REFLECTION_RETRIES:-2}
    
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    
    volumes:
      - ./app:/app/app
      - ./seed:/app/seed
      - ./scripts:/app/scripts
      # So Settings(env_file=".env") resolves inside the container cwd /app
      # - ./.env:/app/.env:ro
    
    command: ["python", "scripts/serve.py"]

volumes:
  postgres_data:
  qdrant_data: